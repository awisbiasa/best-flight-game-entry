<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cold Front — a canyon air-race flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1018; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: 100vw; height: 100vh; object-fit: contain; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0"
  aria-label="Cold Front: a canyon air-race flight game. Arrow keys or W A S D fly, Shift and Control set throttle, Space fires the cannon, R restarts."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
